# Cloudflare Pages — site statique (public/) + fonctions (functions/) + base D1.
name = "propulse-site"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "propulse-analytics"
database_id = "00000000-0000-0000-0000-000000000000" # remplacé après `wrangler d1 create`
migrations_dir = "migrations"

# Secrets (wrangler pages secret put …) : ADMIN_PASSWORD, STRIPE_WEBHOOK_SECRET, TALLY_SIGNING_SECRET
